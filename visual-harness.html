<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>visual</title></head>
<body><div id="app"></div>
<script type="module">
const errors=[]
window.addEventListener('error',e=>errors.push(e.message))
await import('/src/main.js')
const P=new URLSearchParams(location.search)
const dims=(P.get('d')||'900x1200,900x1200').split(',').map(s=>s.split('x').map(Number))
const tick=()=>new Promise(r=>setTimeout(r,16))
function mk(w,h,label,hue){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,`hsl(${hue},68%,56%)`);g.addColorStop(1,`hsl(${hue+38},70%,34%)`);
x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='rgba(255,255,255,.88)';
x.font=`700 ${Math.round(Math.min(w,h)*0.11)}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(label,w/2,h/2);
return new Promise(r=>c.toBlob(b=>r(new File([b],'x.png',{type:'image/png'})),'image/png'))}
async function up(side,w,h,label,hue){if(!w)return;const i=document.getElementById(side+'-input');const dt=new DataTransfer();
dt.items.add(await mk(w,h,label,hue));i.files=dt.files;i.dispatchEvent(new Event('change',{bubbles:true}));
const p=document.getElementById(side+'-preview');for(let k=0;k<600&&p.naturalWidth!==w;k++)await tick();for(let k=0;k<25;k++)await tick()}
if(P.get('empty')!=='1'){
  await up('before',dims[0][0],dims[0][1],'BEFORE',205)
  await up('after',dims[1][0],dims[1][1],'AFTER',142)
  if(P.get('tool')==='arrow'){document.getElementById('tool-arrow').click();for(let k=0;k<30;k++)await tick()}
  if(P.get('tool')==='filter'){document.getElementById('tool-filter').click();for(let k=0;k<30;k++)await tick()}
}
document.title = errors.length ? 'ERR: '+errors.join(' | ') : 'READY'
</script></body></html>
